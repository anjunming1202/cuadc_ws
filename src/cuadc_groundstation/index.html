<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DroneLink Viewer</title>
  <style>
    :root {
      --bg: #0f1216;
      --panel: #1a1f26;
      --text: #e8ecf1;
      --muted: #8b95a5;
      --accent: #3d9cf0;
      --bad: #e35d6a;
      --ok: #3ecf8e;
      --warn: #e6b84d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid #2a3340;
    }
    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    #cpuBadge {
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }
    #cpuBadge.warn { color: var(--warn); }
    #cpuBadge.hot { color: var(--bad); }
    #status {
      font-size: 0.85rem;
      color: var(--muted);
    }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    .rec-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #2a3340;
      border-radius: 5px;
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .rec-btn:hover { border-color: var(--accent); }
    .rec-btn.on { background: var(--bad); color: #fff; border-color: var(--bad); }
    .rec-btn.cv-on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rec-btn:disabled { opacity: 0.6; cursor: default; }
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1rem 1.25rem 2rem;
    }
    .stages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 960px) {
      .stages { grid-template-columns: 1fr; }
    }
    .stage-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .stage-label {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .stage-label .pill {
      display: inline-block;
      margin-left: 0.35rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.72rem;
      text-transform: none;
      letter-spacing: 0;
      background: #243040;
      color: var(--accent);
    }
    .stage {
      position: relative;
      background: #000;
      border: 1px solid #2a3340;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    .hud {
      position: absolute;
      left: 0.75rem;
      top: 0.75rem;
      min-width: 11rem;
      padding: 0.65rem 0.8rem;
      background: rgba(10, 14, 20, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .hud-title {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.45rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .hud-title .telem-state.ok { color: var(--ok); }
    .hud-title .telem-state.stale { color: var(--warn); }
    .hud-title .telem-state.missing { color: var(--bad); }
    .hud-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.2rem 0.75rem;
      font-size: 0.9rem;
    }
    .hud-grid span:nth-child(odd) { color: var(--muted); }
    .hud-grid span:nth-child(even) { color: var(--text); text-align: right; }
    .hint {
      margin-top: 0.85rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    code {
      color: var(--accent);
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <h1>DroneLink</h1>
    <div class="header-right">
      <button id="cvBtn" class="rec-btn" type="button">OpenCV 关</button>
      <button id="recBtn" class="rec-btn" type="button">● 录制</button>
      <div id="cpuBadge">Pi CPU: —</div>
      <div id="status">初始化…</div>
    </div>
  </header>
  <main>
    <div class="stages">
      <div class="stage-wrap">
        <div class="stage-label">原始图传 <span class="pill">:5600 → /stream.ts</span></div>
        <div class="stage">
          <video id="videoClean" muted autoplay playsinline></video>
          <div class="hud" id="hud">
            <div class="hud-title">
              <span>Telemetry</span>
              <span class="telem-state missing" id="telemState">无数据</span>
            </div>
            <div class="hud-grid">
              <span>高度</span><span id="vAlt">—</span>
              <span>姿态</span><span id="vAtt">—</span>
              <span>模式</span><span id="vMode">—</span>
              <span>电量</span><span id="vBatt">—</span>
              <span>Pi CPU</span><span id="vCpu">—</span>
            </div>
          </div>
        </div>
      </div>
      <div class="stage-wrap">
        <div class="stage-label">OpenCV 预览 <span class="pill">:5606 → /stream_cv.ts</span></div>
        <div class="stage">
          <video id="videoCv" muted autoplay playsinline></video>
        </div>
      </div>
    </div>
    <p class="hint">
      左：干净图传 <code>/stream.ts</code>（机载 5603→5600）。
      右：CV 预览 <code>/stream_cv.ts</code>（默认关；顶栏按钮开检测）。
      遥测：UDP JSON <code>:5701</code> → <code>/telemetry.json</code>。
    </p>
  </main>
  <script src="/mpegts.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const cpuBadgeEl = document.getElementById("cpuBadge");
    const telemStateEl = document.getElementById("telemState");
    const vAlt = document.getElementById("vAlt");
    const vAtt = document.getElementById("vAtt");
    const vMode = document.getElementById("vMode");
    const vBatt = document.getElementById("vBatt");
    const vCpu = document.getElementById("vCpu");

    const streamState = { clean: "初始化", cv: "初始化" };

    function setCpuDisplay(pct) {
      if (typeof pct !== "number" || !Number.isFinite(pct)) {
        cpuBadgeEl.textContent = "Pi CPU: —";
        cpuBadgeEl.className = "";
        vCpu.textContent = "—";
        return;
      }
      const text = pct.toFixed(0) + "%";
      cpuBadgeEl.textContent = "Pi CPU: " + text;
      vCpu.textContent = text;
      cpuBadgeEl.className = pct >= 85 ? "hot" : (pct >= 70 ? "warn" : "");
    }

    function refreshStatus() {
      const c = streamState.clean;
      const v = streamState.cv;
      statusEl.textContent = "原始: " + c + "  ·  OpenCV: " + v;
      const bothOk = c === "播放中" && v === "播放中";
      const anyBad = c.indexOf("中断") >= 0 || v.indexOf("中断") >= 0
        || c.indexOf("不支持") >= 0 || v.indexOf("不支持") >= 0;
      statusEl.className = bothOk ? "ok" : (anyBad ? "bad" : "");
    }

    function fmtNum(v, digits) {
      if (typeof v !== "number" || !Number.isFinite(v)) {
        return null;
      }
      return v.toFixed(digits);
    }

    function updateHud(snapshot) {
      const data = snapshot && snapshot.data;
      if (!data) {
        telemStateEl.textContent = "无数据";
        telemStateEl.className = "telem-state missing";
        vAlt.textContent = "—";
        vAtt.textContent = "—";
        vMode.textContent = "—";
        vBatt.textContent = "—";
        setCpuDisplay(null);
        return;
      }

      if (snapshot.ok) {
        telemStateEl.textContent = "在线";
        telemStateEl.className = "telem-state ok";
      } else if (snapshot.stale) {
        telemStateEl.textContent = "过期";
        telemStateEl.className = "telem-state stale";
      } else {
        telemStateEl.textContent = "无数据";
        telemStateEl.className = "telem-state missing";
      }

      const alt = fmtNum(data.alt_m, 1);
      vAlt.textContent = alt === null ? "—" : alt + " m";

      const roll = fmtNum(data.roll_deg, 1);
      const pitch = fmtNum(data.pitch_deg, 1);
      const yaw = fmtNum(data.yaw_deg, 1);
      if (roll === null && pitch === null && yaw === null) {
        vAtt.textContent = "—";
      } else {
        vAtt.textContent =
          (roll === null ? "—" : roll) +
          " / " +
          (pitch === null ? "—" : pitch) +
          " / " +
          (yaw === null ? "—" : yaw);
      }

      vMode.textContent = data.mode != null && data.mode !== "" ? String(data.mode) : "—";

      const pct = fmtNum(data.batt_pct, 0);
      const volts = fmtNum(data.batt_v, 1);
      if (pct === null && volts === null) {
        vBatt.textContent = "—";
      } else if (pct !== null && volts !== null) {
        vBatt.textContent = pct + "% / " + volts + " V";
      } else if (pct !== null) {
        vBatt.textContent = pct + "%";
      } else {
        vBatt.textContent = volts + " V";
      }

      setCpuDisplay(typeof data.cpu_pct === "number" ? data.cpu_pct : null);
    }

    async function pollTelemetry() {
      try {
        const res = await fetch("/telemetry.json", { cache: "no-store" });
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        updateHud(await res.json());
      } catch (err) {
        console.warn("telemetry poll", err);
      }
    }

    function createStreamPlayer(opts) {
      const videoEl = opts.videoEl;
      const streamPath = opts.streamPath;
      const stateKey = opts.stateKey;
      let player = null;
      let reconnectTimer = null;
      let stallTimer = null;
      let reconnectAttempt = 0;
      let lastMediaBytes = 0;
      let generation = 0;

      function setStreamStatus(text) {
        streamState[stateKey] = text;
        refreshStatus();
      }

      function clearTimers() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        if (stallTimer) {
          clearInterval(stallTimer);
          stallTimer = null;
        }
      }

      function destroyPlayer() {
        clearTimers();
        if (!player) {
          return;
        }
        try {
          player.pause();
          player.unload();
          player.detachMediaElement();
          player.destroy();
        } catch (err) {
          console.warn("player destroy", err);
        }
        player = null;
      }

      function scheduleReconnect(reason) {
        if (reconnectTimer) {
          return;
        }
        reconnectAttempt += 1;
        const delayMs = Math.min(3000, 400 * reconnectAttempt);
        setStreamStatus("中断（" + reason + "），重连中");
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          startPlayer();
        }, delayMs);
      }

      function watchForStall(gen) {
        // CV preview is intentionally low-fps (~10); buffered.end often pauses
        // between frames and used to trigger a reconnect loop (画面卡住闪烁).
        // Only stall-watch the clean 30fps path.
        if (stateKey === "cv") {
          return;
        }
        lastMediaBytes = 0;
        stallTimer = setInterval(() => {
          if (gen !== generation || !player) {
            return;
          }
          const buffered = videoEl.buffered;
          let end = 0;
          if (buffered.length > 0) {
            end = buffered.end(buffered.length - 1);
          }
          const marker = Math.floor(end * 1000);
          if (marker === lastMediaBytes && !videoEl.paused && videoEl.readyState >= 2) {
            scheduleReconnect("卡顿");
            return;
          }
          lastMediaBytes = marker;
        }, 2500);
      }

      function startPlayer() {
        destroyPlayer();
        generation += 1;
        const gen = generation;

        if (!window.mpegts || !mpegts.getFeatureList().mseLivePlayback) {
          setStreamStatus("不支持 MSE");
          return;
        }

        const url = streamPath + "?t=" + Date.now();
        player = mpegts.createPlayer(
          {
            type: "mse",
            isLive: true,
            hasAudio: false,
            hasVideo: true,
            url: url,
          },
          {
            enableStashBuffer: true,
            stashInitialSize: stateKey === "cv" ? 256 : 128,
            liveBufferLatencyChasing: stateKey !== "cv",
            liveBufferLatencyMaxLatency: stateKey === "cv" ? 3.0 : 1.2,
            liveBufferLatencyMinRemain: stateKey === "cv" ? 0.8 : 0.3,
          }
        );

        player.attachMediaElement(videoEl);
        player.on(mpegts.Events.ERROR, (type, detail, info) => {
          if (gen !== generation) {
            return;
          }
          console.error("mpegts error", stateKey, type, detail, info);
          const reason = detail || type || "播放错误";
          destroyPlayer();
          scheduleReconnect(String(reason));
        });
        player.load();
        const playPromise = player.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch((err) => {
            if (gen !== generation) {
              return;
            }
            console.warn("autoplay blocked or failed", err);
            setStreamStatus("点击页面以播放");
          });
        }
        setStreamStatus(reconnectAttempt ? "重连中…" : "拉流中…");
        videoEl.addEventListener(
          "playing",
          () => {
            if (gen !== generation) {
              return;
            }
            reconnectAttempt = 0;
            setStreamStatus("播放中");
            watchForStall(gen);
          },
          { once: true }
        );
      }

      return { start: startPlayer };
    }

    const cleanPlayer = createStreamPlayer({
      videoEl: document.getElementById("videoClean"),
      streamPath: "/stream.ts",
      stateKey: "clean",
    });
    const cvPlayer = createStreamPlayer({
      videoEl: document.getElementById("videoCv"),
      streamPath: "/stream_cv.ts",
      stateKey: "cv",
    });

    // ---- 录制(和视频/任务解耦,只调服务端 /record/*) ----
    // 一键同时录干净图传 + CV 预览两路 + 遥测,落 server 的 recordings/。
    const recBtn = document.getElementById("recBtn");
    let recOn = false;
    function fmtDur(sec) {
      sec = Math.floor(sec || 0);
      const m = Math.floor(sec / 60), s = sec % 60;
      return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }
    function applyRec(st) {
      recOn = !!(st && st.recording);
      if (recOn) {
        recBtn.textContent = "■ 停止 " + fmtDur(st.seconds);
        recBtn.classList.add("on");
      } else {
        recBtn.textContent = "● 录制";
        recBtn.classList.remove("on");
      }
    }
    async function toggleRec() {
      recBtn.disabled = true;
      try {
        const res = await fetch(recOn ? "/record/stop" : "/record/start", { method: "POST" });
        applyRec(await res.json());
      } catch (err) {
        console.warn("record", err);
      } finally {
        recBtn.disabled = false;
      }
    }
    async function pollRec() {
      try {
        const res = await fetch("/record/status", { cache: "no-store" });
        applyRec(await res.json());
      } catch (err) { /* server down */ }
    }
    recBtn.addEventListener("click", toggleRec);
    pollRec();
    setInterval(pollRec, 1000);

    const cvBtn = document.getElementById("cvBtn");
    let cvOn = false;
    function applyCv(st) {
      cvOn = !!(st && st.running);
      cvBtn.textContent = cvOn ? "OpenCV 开" : "OpenCV 关";
      cvBtn.classList.toggle("cv-on", cvOn);
      cvBtn.title = st && st.error ? String(st.error) : "";
    }
    async function toggleCv() {
      cvBtn.disabled = true;
      try {
        const res = await fetch(cvOn ? "/cv-preview/stop" : "/cv-preview/start", { method: "POST" });
        applyCv(await res.json());
      } catch (err) {
        console.warn("cv-preview", err);
      } finally {
        cvBtn.disabled = false;
      }
    }
    async function pollCv() {
      try {
        const res = await fetch("/cv-preview/status", { cache: "no-store" });
        applyCv(await res.json());
      } catch (err) { /* server or Pi ctrl down */ }
    }
    cvBtn.addEventListener("click", toggleCv);
    pollCv();
    setInterval(pollCv, 2000);

    cleanPlayer.start();
    cvPlayer.start();
    pollTelemetry();
    setInterval(pollTelemetry, 200);
  </script>
</body>
</html>
