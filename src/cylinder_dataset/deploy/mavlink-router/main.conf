# mavlink-router 配置：让路由器成为 /dev/ttyAMA0 的唯一持有者，向多个 UDP
# 端点分发原始 MAVLink（双向）。这样地面站遥测、数据集采集、（真实任务的
# cuadc_interface）可以同时连各自端点，互不抢串口。
# 部署位置：/etc/mavlink-router/main.conf

[General]
TcpServerPort = 0
ReportStats = false

[UartEndpoint fc]
Device = /dev/ttyAMA0
Baud = 57600

# 给数据集采集脚本（capture_external / capture_grid）。Server 模式：客户端
# 用 udp:127.0.0.1:14550 连上来；自主飞行要发指令也走这条（双向）。
[UdpEndpoint capture]
Mode = Server
Address = 127.0.0.1
Port = 14550

# 给 dronelink-telemetry（把它的 --device 改成 udp:127.0.0.1:14551）
[UdpEndpoint telemetry]
Mode = Server
Address = 127.0.0.1
Port = 14551

# 可选：给地面站 Mission Planner/QGC 原始 MAVLink。Normal 模式主动发到该地址。
# 不需要就删掉这一段。
[UdpEndpoint gcs]
Mode = Normal
Address = 192.168.50.2
Port = 14560
