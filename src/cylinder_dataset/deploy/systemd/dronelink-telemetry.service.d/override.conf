# drop-in：让 dronelink-telemetry 不再直接开串口，而是从 mavlink-router 的
# UDP 端点读 MAVLink。它发给地面站的那份 JSON 叠加完全不变。
# 部署位置：/etc/systemd/system/dronelink-telemetry.service.d/override.conf
# 改完执行：sudo systemctl daemon-reload && sudo systemctl restart dronelink-telemetry
[Unit]
After=mavlink-router.service
Requires=mavlink-router.service

[Service]
# 先清空原 ExecStart 再设新的（systemd drop-in 覆盖单值指令的写法）。
ExecStart=
ExecStart=/home/wly/dronelink-venv/bin/python3 /usr/local/sbin/dronelink-telemetry.py --device udp:127.0.0.1:14551 --dest-host 192.168.50.2,10.10.10.2 --dest-ports 5701,5601 --hz 10
