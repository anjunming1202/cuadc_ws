# 起降点蓝圆布 HSV。与投放区 color_pad.real.yaml 的蓝垫同一套 census
# （OpenCV H 0-179, S/V 0-255）。现场光照再改这两行即可，算法不用动。
blue_lo: [100, 80, 50]
blue_hi: [130, 255, 255]
proc_w: 960                 # 真机 1920 宽降到这么宽再处理
morph_k: 7                  # 开/闭运算核，抹小噪点、把 H 缝稍微补上
min_area_px: 80             # 绝对面积下限：滤随机斑，故意放宽
min_circularity: 0.35       # 面积 / 外接圆面积；0.35 还能过透视椭圆
