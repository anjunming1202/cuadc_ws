# 机体固定几何的单一真源：各部件相对飞控（EKF 参考点）的位置，机体 FRD（前/右/下），米。
# 真机实测（ADR-0010 簇①②）；真机与仿真共用这一份。仿真模型 cuadc_sim/models/cuadc_iris/model.sdf
# 须与之一致（改了这里就改 SDF，再跑 src/cuadc_sim/field/check_airframe.py 校验）。
# 读它的：感知反投影（相机位姿、地面高度）、决策接近（相机深度、投放口杠杆臂）、仿真投放桥（投放次序）。

fc_rest_clearance_m: 0.31          # 停在地面时飞控离地高（起落架底在飞控下方这么多）

camera:
  position_m: [0.11, 0.0, 0.20]    # 相机光心（前/右/下）
  mount_rad: [0.0, 1.5708, 0.0]    # roll/pitch/yaw：pitch=+π/2 正下视，yaw=0 图像上方朝机头

drop_ports:                        # 按投放次序排列（= 舵机放料 / 仿真脱钩次序）
  - name: left
    position_m: [0.0, -0.04]       # 前/右
  - name: right
    position_m: [0.0, 0.04]
