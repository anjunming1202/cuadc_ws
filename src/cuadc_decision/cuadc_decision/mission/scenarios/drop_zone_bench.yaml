# 投放区单练：从投放前一个 state(ARM_AND_TAKEOFF)起，起飞→飞抵投放区→搜索→接近→投放，
# 投满即 RTL(phases 无 recon)。配合 run_gazebo_drop_zone_bench.sh 的近投放区出生世界。
# SEARCH 简化「看到候选就去投」靠覆盖 search 门实现，mission_logic 里无 test-only 分支。
initial_state: ARM_AND_TAKEOFF
phases: [drop]
search_overrides:
  min_candidates_before_select: 1     # 看到一个可信候选就选（不必等凑够 3 个/扫完全程）
