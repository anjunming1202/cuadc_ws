# 世界/任务参数 —— sim 档。字段 = MissionWorld 字段。取值须与 cuadc_sim/field/config.py
# 建出的仿真世界对应（区中心来自那份固定开发场地；值不对会在压测台端到端暴露）。按设计
# 与 field/config.py 分别维护、不跨包 import。initial_state/phases 属场景，不在 base 里写。
takeoff_point: [0.0, 0.0]            # 起飞点场地坐标 = 仿真出生点（field/config.py LANDING_PAD_CENTER）
cruise_alt_m: 3.0                    # 起飞、飞往投放区/侦察区
search_alt_m: 5.0                    # 投放区搜索/侦察区覆盖：5m 时相机横向覆盖 ±2.6m，配扫描航点横向 ±2m

drop_zone_center: [32.5, 0.0]        # field-layout.md 投放区 x in [30,35] 中点
drop_scan_offsets:                   # 相对中心的 (dx 向前, dy 向右)，占位间距，真实相机 FOV 定下来再调
  - [-1.0, 2.0]
  - [-1.0, -2.0]
  - [0.0, -2.0]
  - [0.0, 2.0]
  - [1.0, 2.0]
  - [1.0, -2.0]

recon_zone_center: [57.5, 0.0]       # 侦察区 x in [55,60] 中点
recon_scan_offsets:
  - [-1.5, 2.0]
  - [-1.5, -2.0]
  - [0.0, -2.0]
  - [0.0, 2.0]
  - [1.5, 2.0]
  - [1.5, -2.0]

recon_cylinder_count: 5
drop_count_target: 2
drop_recon_split_x_m: 45.0
# 投放执行器参数（RC 通道/PWM/时长）属接口层，不在任务配置层，见 docs/spec/adr/0007
