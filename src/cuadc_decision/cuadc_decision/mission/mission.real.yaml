# 世界/任务参数 —— real 档。字段 = MissionWorld 字段。真机部署时按现场复测更新：区中心/
# 扫描样式随真实场地（比赛随机布局须现场测）、巡航高度按安全要求、relay 通道按投放机构接线。
# 先以 sim 档为占位起点；真机测试只改这份，改不到仿真。initial_state/phases 属场景。
# 场地坐标 = 起飞坐标系轴（docs/spec/coordinate-frames.md）：原点 = 起降点圆心，+x = 起飞时机头方向（飞机放在
# 起降点、机头朝投放区），+y = 其右侧。数值按规则书 field-layout.md（它的 y 取左侧，填这里时左侧取负）。
# 摆放朝向偏 1° ≈ 32.5m 处横偏 0.57m。
takeoff_point: [0.0, 0.0]            # 起飞(解锁)点 = 起降点圆心
cruise_alt_m: 5.0                    # 起飞、飞往投放区/侦察区（= 搜索高度，进区不用再爬升）
search_alt_m: 5.0                    # 投放区搜索/侦察区覆盖。整筒入画：横向 ±0.545·D−0.1、纵向 ±0.299·D−0.1，D = 高度+0.11−筒高

drop_zone_center: [32.5, 0.0]        # 规则书：投放区 x∈[30,35]
# 扫描样式：2 条横扫（dx ±1.2）× 横向 ±2.0。5m 高每条纵向覆盖 ±1.34m → x 覆盖 ±2.54（筒心 |x|≤2.4），横向覆盖 ±4.5（筒心 |y|≤3.9）。
drop_scan_offsets:
  - [-1.2, 2.0]
  - [-1.2, -2.0]
  - [1.2, -2.0]
  - [1.2, 2.0]

recon_zone_center: [57.5, 0.0]       # 规则书：侦察区 x∈[55,60]
recon_zone_size: [5.0, 8.0]          # 规则书：侦察区 纵(x) 5m × 横(y) 8m
recon_scan_offsets:
  - [-1.2, 2.0]
  - [-1.2, -2.0]
  - [1.2, -2.0]
  - [1.2, 2.0]

recon_cylinder_count: 5
drop_count_target: 2                 # 规则书：投放 2 次
drop_recon_split_x_m: 45.0           # 规则书：过渡区 x∈[35,55] 中点
# 投放执行器参数（RC 通道/PWM/时长）属接口层，不在任务配置层，见 docs/spec/adr/0007
