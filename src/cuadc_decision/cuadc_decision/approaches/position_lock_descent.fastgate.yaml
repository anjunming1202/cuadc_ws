# 投放门放快（approach_variant:=...,fastgate，可与 high 叠加）。2026-10-05 实飞投放高度处投放口误差
# p50 6.9cm、<4cm 只占 16%、<8cm 61%：4cm 门难过，15s 才放宽太慢。中号筒半径 0.10m − 瓶半径 ~0.035m
# = 6.5cm 内落点仍进筒。
drop_tol_m: 0.05
stable_timeout_s: 8.0      # 到投放高度 8s 没过门就放宽到 relaxed_drop_tol_m
relaxed_timeout_s: 12.0    # 放宽后再 12s 没过门才放弃
stable_hold_s: 0.3
