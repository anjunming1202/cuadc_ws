# cone_descent_ibvs —— sim 档。字段 = ApproachConfig 字段。
cruise_alt_m: 2.0
drop_alt_m: 1.0
cylinder_height_m: 0.3
fc_rest_clearance_m: 0.31       # 飞控静止离地(ADR-0010 簇①);h 是解锁点参照,加它才是离地高
camera_below_fc_m: 0.20         # 相机在飞控下方(ADR-0010 簇①)
dt_s: 0.1
min_conf: 0.5
min_conf_terminal: 0.25       # 末端放低:近距圆盘残缺置信度塌落;硬锁关联门挡垃圾(见 ApproachConfig 注释)
coarse_radius_m: 1.0
refine_gate_m: 0.65
handoff_off_m: 0.4             # 收紧:末端从更小初始误差起步,压交接过冲振荡
handoff_speed_mps: 0.25        # 收紧:先停稳再交接(多等1-2s换无过冲)
kp: 1.2
ki: 0.4
kd: 0.3
v_max_mps: 1.0
brake_decel_mps2: 0.8           # 抛物线刹车:v≤√(2·a·herr),0.4m 误差→0.8m/s、4cm→0.25m/s
i_zone_m: 0.4
lever_arms_m: [[-0.11, -0.04], [-0.11, 0.04]]  # 按投放次序:筒1左口/筒2右口(实测,ADR-0010 簇②),与脱钩次序一致
aim_trims_m: [[0.0, 0.0], [0.0, 0.0]]           # 经验瞄准修正(前,右)米/每口:实测落点偏差均值反填;[DROP_AIM] 日志是标定输入

max_coast_ticks: 4
endgame_alt_band_m: 0.25        # 收口锁带宽:丢检测时已收敛且 h≤drop_alt+此值 → 盲收口投放(实测丢失点 1.05-1.13)
descend_rate_mps: 0.4
alt_hold_p: 1.2                 # 末端高度P:比例减速进 drop_alt+过低爬回(消超冲/有偏量测暴露窗)
drop_tol_m: 0.04
speed_tol_mps: 0.15
level_tol_rad: 0.1
stable_hold_s: 1.0
# ---- 锥面/迁移/重捕获(本模块专属) ----
fov_half_deg: 17.25             # 纵向半FOV(实测标定 33.4°/2)
fov_margin_deg: 4.0             # 可见性余量(俯仰瞬态+圆盘半径的角预算)
funnel_slope: 0.35              # 精度漏斗展开斜率(米误差/米高度)
aim_migrate_top_m: 1.8          # 以上瞄画面中心
aim_migrate_bot_m: 1.15         # 以下全量杆臂
climb_rate_mps: 0.3             # 持续丢失原地爬升重捕获
reacquire_ceiling_m: 1.9        # 爬到此高度仍未重见 -> 退回粗段
