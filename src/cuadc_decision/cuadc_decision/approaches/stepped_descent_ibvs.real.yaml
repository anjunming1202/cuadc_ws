# stepped_descent_ibvs —— 真机档。当前是 sim 值的占位副本;上真机要按
# 真实动力学/延迟重调、按实测填。真机上真正会跟 sim 分叉的:
#   - kp/ki/kd、handoff_speed_mps：真机速度环延迟更大,增益通常要降、交接更保守;
#   - lever_arms_m：真实投放机构相对相机的机体系杆臂(米),必须实测;
#   - drop_tol_m/speed_tol_mps：按真机定位/风况放宽。
cruise_alt_m: 2.0
drop_alt_m: 1.0
cylinder_height_m: 0.3
fc_rest_clearance_m: 0.31       # 飞控静止离地(ADR-0010 簇①);h 是解锁点参照,加它才是离地高
camera_below_fc_m: 0.20         # 相机在飞控下方(ADR-0010 簇①)
dt_s: 0.1
min_conf: 0.5
min_conf_terminal: 0.25       # 末端放低:近距圆盘残缺置信度塌落;硬锁关联门挡垃圾(见 ApproachConfig 注释)
coarse_radius_m: 1.0
refine_gate_m: 0.4
handoff_off_m: 0.4             # 收紧:末端从更小初始误差起步,压交接过冲振荡
handoff_speed_mps: 0.25        # 收紧:先停稳再交接(多等1-2s换无过冲)
kp: 1.2
ki: 0.4
kd: 0.3
v_max_mps: 1.0
brake_decel_mps2: 0.8           # 抛物线刹车:v≤√(2·a·herr),0.4m 误差→0.8m/s、4cm→0.25m/s
i_zone_m: 0.4
lever_arms_m: [[-0.11, -0.04], [-0.11, 0.04]]  # 按投放次序:筒1左口/筒2右口(实测,相对相机 前/右),与脱钩次序一致
aim_trims_m: [[0.0, 0.0], [0.0, 0.0]]           # 经验瞄准修正(前,右)米/每口:实测落点偏差均值反填;[DROP_AIM] 日志是标定输入

max_coast_ticks: 4
reacquire_after_ticks: 20     # 持续丢失 2s(@10Hz)退回粗段重走漏斗(低空丢定死锁的出路)
endgame_alt_band_m: 0.25        # 收口锁带宽:真机同几何(末端贴近必丢筒),数值待真机丢失高度实测后校
descend_rate_mps: 0.4
descend_pause_off_m: 0.30
alt_hold_p: 1.2                 # 末端高度P:比例减速进 drop_alt+过低爬回(消超冲/有偏量测暴露窗)
drop_tol_m: 0.04
speed_tol_mps: 0.15
level_tol_rad: 0.1
stable_hold_s: 1.0
