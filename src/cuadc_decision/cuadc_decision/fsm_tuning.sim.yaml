# 顶层任务 FSM 本体通用调参 —— sim 档。字段 = FsmTuning 字段（B′：不属于任何可替换算法）。
position_tolerance_m: 0.5
altitude_tolerance_m: 0.5
recon_coverage_match_m: 0.6
drop_phase_timeout_s: 90.0
recon_phase_timeout_s: 90.0
battery_critical_fraction: 0.20
gps_fix_ok_threshold: 3
emulate_pilot_arm: true          # sim 没有飞手：WAIT_PILOT_ARM 里替飞手切 STABILIZE+解锁
transit_speed_mps: 5.0           # 飞往投放区/侦察区
search_speed_mps: 3.0            # 搜索航点之间 + 粗对准；= 飞控 WP_SPD（飞控重进位置控制会退回它）
zone_climb_mps: 0.0              # 投放/侦察区内爬升限速复写；0 = 飞控 WP_SPD_UP
zone_descent_mps: 0.0            # 投放/侦察区内下降限速复写；0 = 飞控 WP_SPD_DN
