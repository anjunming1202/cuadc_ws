# coverage_scan 侦察覆盖扫描 —— real 档。字段 = SurveyConfig 字段。先以 sim 档为起点，
# 按真机图传实际清晰度调高度/速度（真机图传 1920 宽，同高度比 sim 的 960 清楚一倍）。
scan_alt_m: 3.0              # 扫描高度
scan_speed_mps: 1.0          # 扫描线上的水平限速：慢到图传能看清每个筒
view_offset_ratio: 0.2       # 偏离筒正上方 ≤ 此比例×相机离地高时整块标识不被筒壁挡（筒高 0.15、内径 0.18、标识菱形半径 0.06）
edge_margin_m: 0.1           # 筒心离区边界的最小距离（筒半径）
arrive_tol_m: 0.3            # 扫描线端点到点容差：太大会在线端提前拐弯，漏掉区边上的筒
alt_tol_m: 0.3               # 到扫描高度的容差
