# 顶层任务 FSM 本体通用调参 —— real 档。字段 = FsmTuning 字段。真机按真实定位精度/时间预算/
# 电量安全余量重调；先以 sim 档为起点（真机 GPS/EKF 抖动更大时可放宽到点容差、提高电量下限）。
position_tolerance_m: 0.5
altitude_tolerance_m: 0.5
recon_coverage_match_m: 0.6
drop_phase_timeout_s: 90.0
recon_phase_timeout_s: 90.0
battery_critical_fraction: 0.20
gps_fix_ok_threshold: 3
emulate_pilot_arm: false         # 真机：解锁/上锁只归飞手 RC，Pi 不发 arm
